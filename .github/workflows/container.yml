name: Build and promote backend

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: backend-container-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write
  attestations: write
  id-token: write

env:
  IMAGE: ghcr.io/assembly-os/backend
  TAG: backend-${{ github.sha }}

jobs:
  container:
    name: Validate, publish, and promote
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Use Node 24.19.0
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.19.0
          cache: npm

      - name: Install the locked dependency graph
        run: npm ci --ignore-scripts

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Find an existing immutable image
        if: github.event_name != 'pull_request'
        id: existing
        shell: bash
        run: |
          set -euo pipefail
          if digest="$(docker buildx imagetools inspect "$IMAGE:$TAG" --format '{{.Manifest.Digest}}' 2>/dev/null)"; then
            [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "digest=$digest" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Validate the production image
        if: github.event_name == 'pull_request'
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          platforms: linux/amd64
          push: false
          load: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and publish the immutable image
        if: github.event_name != 'pull_request' && steps.existing.outputs.exists != 'true'
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ env.IMAGE }}:${{ env.TAG }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ env.TAG }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max
          sbom: true

      - name: Select the immutable digest
        if: github.event_name != 'pull_request'
        id: subject
        shell: bash
        env:
          EXISTING_DIGEST: ${{ steps.existing.outputs.digest }}
          BUILT_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          digest="${EXISTING_DIGEST:-${BUILT_DIGEST:-}}"
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      - name: Scan the published digest
        if: github.event_name != 'pull_request'
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}@${{ steps.subject.outputs.digest }}
          format: table
          exit-code: '1'
          # Unfixed distro advisories have no remediation path; every actionable
          # HIGH/CRITICAL finding still blocks promotion.
          ignore-unfixed: true
          severity: HIGH,CRITICAL

      - name: Publish GitHub build provenance
        if: github.event_name != 'pull_request' && steps.existing.outputs.exists != 'true'
        uses: actions/attest-build-provenance@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.subject.outputs.digest }}
          push-to-registry: true

      - name: Check out the desired-state repository
        if: github.event_name != 'pull_request'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: Assembly-OS/infra
          token: ${{ secrets.INFRA_REPO_TOKEN }}
          path: infra
          ref: main

      - name: Promote only the backend manifest
        if: github.event_name != 'pull_request'
        working-directory: infra
        shell: bash
        env:
          DIGEST: ${{ steps.subject.outputs.digest }}
        run: |
          set -euo pipefail
          manifest=apps/backend/image.env
          mkdir -p "$(dirname "$manifest")"
          printf 'BACKEND_IMAGE=%s@%s\nBACKEND_VERSION=%s\n' "$IMAGE" "$DIGEST" "$TAG" > "$manifest"
          git config user.name assembly-os-promoter
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -- "$manifest"
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "deploy(backend): $TAG"
          for attempt in 1 2 3 4 5; do
            if git push origin HEAD:main; then
              exit 0
            fi
            git pull --rebase origin main
            sleep "$((attempt * 2))"
          done
          echo 'Unable to promote backend after five attempts.' >&2
          exit 1
